services:
  - type: web
    name: nsl-portal-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_MODE
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@nsl.gov.et
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
